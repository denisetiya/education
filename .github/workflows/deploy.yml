name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend
  DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH || '/opt/geoeducation' }}
  FRONTEND_URL: ${{ vars.FRONTEND_URL || 'https://geoeducation.denisetiya.site' }}

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build and Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare deployment directory
        uses: appleboy/ssh-action@v1.0.3
        env:
          REMOTE_DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || secrets.VPS_SSH_PORT || '22' }}
          envs: REMOTE_DEPLOY_PATH
          script: |
            set -eu
            mkdir -p "$REMOTE_DEPLOY_PATH"

      - name: Copy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || secrets.VPS_SSH_PORT || '22' }}
          source: "docker-compose.yml"
          target: ${{ env.DEPLOY_PATH }}

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_REPOSITORY: ${{ github.repository }}
          DEPLOY_IMAGE_TAG: ${{ github.sha }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          DEPLOY_FRONTEND_URL: ${{ env.FRONTEND_URL }}
          DEPLOY_JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DEPLOY_CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          DEPLOY_GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DEPLOY_GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || secrets.VPS_SSH_PORT || '22' }}
          envs: DEPLOY_REPOSITORY,DEPLOY_IMAGE_TAG,DEPLOY_PATH,DEPLOY_FRONTEND_URL,DEPLOY_JWT_SECRET,DEPLOY_CLOUDFLARE_TUNNEL_TOKEN,DEPLOY_GHCR_TOKEN,DEPLOY_GHCR_USERNAME
          script: |
            set -eu

            if ! command -v docker >/dev/null 2>&1; then
              echo "Docker is not installed on the server."
              exit 1
            fi

            docker compose version >/dev/null

            mkdir -p "$DEPLOY_PATH/data/backend"
            cd "$DEPLOY_PATH"

            umask 077
            {
              printf 'GITHUB_REPOSITORY=%s\n' "$DEPLOY_REPOSITORY"
              printf 'IMAGE_TAG=%s\n' "$DEPLOY_IMAGE_TAG"
              printf 'JWT_SECRET=%s\n' "$DEPLOY_JWT_SECRET"
              printf 'FRONTEND_URL=%s\n' "$DEPLOY_FRONTEND_URL"
              printf 'CLOUDFLARE_TUNNEL_TOKEN=%s\n' "$DEPLOY_CLOUDFLARE_TUNNEL_TOKEN"
              printf 'DATABASE_URL=%s\n' 'file:/app/data/prod.db'
              printf 'BACKEND_DATA_DIR=%s\n' './data/backend'
            } > .env

            if [ -n "$DEPLOY_GHCR_TOKEN" ]; then
              printf '%s' "$DEPLOY_GHCR_TOKEN" | docker login ghcr.io -u "$DEPLOY_GHCR_USERNAME" --password-stdin
            else
              echo "GHCR_TOKEN is empty; skipping docker login."
            fi

            docker compose pull
            docker compose run --rm backend npx prisma migrate deploy
            docker compose up -d --remove-orphans

            sleep 10
            docker compose ps
            docker compose exec -T frontend wget -qO- http://localhost/health
