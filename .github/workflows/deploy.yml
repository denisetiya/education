name: Build and Deploy

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend

jobs:
  build:
    name: Build and Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            REPO_DIR="/home/ubuntu/geoeducation"
            REPO_URL="https://github.com/${{ github.repository }}.git"
            
            # Clone if directory doesn't exist or is not a git repo
            if [ ! -d "$REPO_DIR/.git" ]; then
              echo "📦 Cloning repository..."
              rm -rf "$REPO_DIR"
              git clone "$REPO_URL" "$REPO_DIR"
            fi
            
            cd "$REPO_DIR"
            
            # Pull latest changes (for docker-compose.yml updates)
            echo "📥 Pulling latest changes..."
            git fetch origin main
            git reset --hard origin/main
            
            # Create .env if not exists
            if [ ! -f .env ]; then
              echo "🔧 Creating .env file..."
              echo "GITHUB_REPOSITORY=${{ github.repository }}" > .env
              echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
              echo "FRONTEND_URL=https://geoeducation.denisetiya.site" >> .env
              echo "CLOUDFLARE_TUNNEL_TOKEN=${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}" >> .env
            else
              # Update GITHUB_REPOSITORY in existing .env
              sed -i '/^GITHUB_REPOSITORY=/d' .env
              echo "GITHUB_REPOSITORY=${{ github.repository }}" >> .env
            fi
            
            # Login to GHCR
            echo "🔐 Logging in to GHCR..."
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull latest images and restart containers
            echo "🐳 Pulling and starting containers..."
            docker compose pull
            docker compose down
            docker compose up -d
            
            # Wait for services to be ready
            sleep 10
            
            # Check health
            echo "📊 Container status:"
            docker compose ps

      - name: Verify Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            cd /home/ubuntu/geoeducation
            RUNNING=$(docker compose ps --format json | jq -r '.[] | select(.State == "running") | .Name' | wc -l)
            if [ "$RUNNING" -lt 3 ]; then
              echo "❌ Not all containers are running!"
              docker compose logs
              exit 1
            fi
            echo "✅ All containers are running!"
